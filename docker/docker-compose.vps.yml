# Standalone production compose file for a shared VPS that already runs
# other sites (nginx + other apps on other ports). Deliberately NOT an
# overlay of docker-compose.yml — kept as its own file so there's no
# version-dependent merge behavior to reason about.
#
# Usage (from the docker/ directory on the VPS):
#   docker compose -f docker-compose.vps.yml --env-file ../apps/backend/.env run --rm migrate
#   docker compose -f docker-compose.vps.yml --env-file ../apps/backend/.env up --build -d
#
# Design for a shared box:
#   - Postgres/Redis publish NO ports to the host at all — reachable only
#     from other containers on this compose project's internal network.
#   - Backend/dashboard bind to 127.0.0.1 only, on ports chosen to avoid
#     this VPS's existing sites (checked live: 3000-3007, 5000, 8080,
#     8090-8098 were already taken). The public-facing Nginx (already
#     installed on this box for other sites) reverse-proxies to these.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: live_user
      POSTGRES_PASSWORD: live_password
      POSTGRES_DB: live_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U live_user -d live_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../apps/backend/.env
    environment:
      DATABASE_URL: postgresql://live_user:live_password@postgres:5432/live_platform
    entrypoint: ["npm", "run", "migrate:prod"]
    profiles: ["tools"]

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../apps/backend/.env
    environment:
      DATABASE_URL: postgresql://live_user:live_password@postgres:5432/live_platform
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: ..
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:4001:3000"

volumes:
  postgres_data:
